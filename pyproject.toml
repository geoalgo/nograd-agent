[project]
name = "autoresearch"
version = "0.1.0"
description = "Coding agents improving training scripts, run as Syne Tune trials"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "syne-tune>=0.16.0",
]

[project.scripts]
nograd-agent = "autoresearch.cli:main"

[project.optional-dependencies]
# Dependencies of examples/tabular.
examples = [
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autoresearch"]
